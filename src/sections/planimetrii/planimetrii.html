<section id="planimetrii" class="section elementor-section">
  <div class="container">
    <p class="section__eyebrow">Planimetrii</p>
    <h2 class="section__title">Alege apartamentul direct de pe plan.</h2>
    <p class="section__text">
      Fiecare apartament poate fi selectat direct pe planul nivelului. La click
      vezi schița detaliată a apartamentului și informațiile principale.
    </p>

    <div class="floor-maps">
      <!-- BLOC B PRIMUL -->
      <div class="floor-map" data-bloc="B">
        <!-- imaginea blocului B -->
        <img
          src="/plans/bloc-b.png"
          alt="Planimetrie Bloc B"
          class="floor-map__img"
        />

        <!-- overlay cu apartamentele Bloc B -->
        <svg
          class="floor-map__overlay"
          viewBox="0 0 1780 2560"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g role="list">
            <!-- exemple, vei înlocui cu path-urile reale -->
            <g role="listitem" class="apt-shape" data-apt-id="b-01" aria-label="Apartament 55.03 mp">
              <path  d="M180 50 L550 50 L550 420 L670 420 L670 670 L580 670 L580 700 L480 700 L480 620 L180 620 Z" />
            </g>

            <g role="listitem" class="apt-shape" data-apt-id="b-02">
              <path d="M550 50 L950 50 L950 660 L680 660 L680 420 L550 420 Z" />
            </g>
            <g role="listitem" class="apt-shape" data-apt-id="b-03">
              <path d="M950 50 L1340 50 L1330 420 L1220 420 L1220 660 L950 660 Z" />
            </g>
          </g>
        </svg>
      </div>

      <!-- BLOC A AL DOILEA -->
      <div class="floor-map" data-bloc="A">
        <!-- imaginea blocului A -->
        <img
          src="/plans/bloc-a.png"
          alt="Planimetrie Bloc A"
          class="floor-map__img"
        />

        <!-- overlay cu apartamentele Bloc A -->
        <svg
          class="floor-map__overlay"
          viewBox="0 0 1780 2560"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g role="list">
            <!-- exemple, vei înlocui cu path-urile reale -->
            <g role="listitem" class="apt-shape" data-apt-id="a-01">
              <path d="M420 170 L825 170 L825 30 L1220 30 L1220 340 L1050 340 L1050 455 L950 455 L950 580 L420 580 Z" />
            </g>

            <g role="listitem" class="apt-shape" data-apt-id="a-02">
              <path d="M1220 30 L1745 30 L1745 560 L1090 560 L1090 455 L1050 455 L1050 340 L1220 340 Z" />
            </g>

            <g role="listitem" class="apt-shape" data-apt-id="a-03">
              <path d="M1090 580 L1745 580 L1745 960 L1090 960 Z" />
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>
</section>
