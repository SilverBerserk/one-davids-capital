<div class="apt-modal" id="aptModal" aria-hidden="true">
  <div class="apt-modal__dialog" role="dialog" aria-modal="true">


    <div class="apt-modal__header">
      <button
      type="button"
      class="apt-modal__close"
      data-apt-modal-close
      aria-label="Închide"
    >
      ✕
    </button>
      <p class="apt-modal__eyebrow">Planimetrie apartament</p>
      <h3 class="apt-modal__title" id="aptModalTitle">Apartament</h3>
      <p class="apt-modal__meta" id="aptModalMeta"></p>
    </div>

    <div class="apt-modal__body">
      <img
        id="aptModalImage"
        class="apt-modal__image"
        src=""
        alt="Planimetrie apartament"
      />

      <div class="apt-modal__placeholder" id="aptModalPlaceholder">
        Încarcă aici planurile detaliate ale apartamentelor.
      </div>
    </div>

    <div class="apt-modal__footer">
      <p>
        *Planimetriile au caracter informativ. Dimensiunile exacte pot varia în funcție de scară și poziționare.
      </p>
    </div>
  </div>
</div>
